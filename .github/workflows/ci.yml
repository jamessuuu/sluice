name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # M6 (SPEC §8): "unit... incl. runStoreConformance against MemoryStore
    # AND a postgres:17 service container (CI never needs Neon)." This is
    # the real enforcement — packages/sluice-store-postgres/src/store.real.test.ts
    # runs the identical SluiceStore conformance suite against this service
    # (gated on DATABASE_URL) alongside the always-on pglite run in
    # store.conformance.test.ts, which needs neither Docker nor this service.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sluice
          POSTGRES_PASSWORD: sluice
          POSTGRES_DB: sluice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sluice:sluice@localhost:5432/sluice_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The five stages (PROGRAM.md D6). Order is the argument:
      # typecheck -> lint -> unit -> e2e:smoke -> eval
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: migrate postgres store (CI service)
        run: pnpm --filter @jamessuuu/sluice-store-postgres run db:migrate
      - name: unit
        run: pnpm test -- --project unit
      - name: e2e-smoke
        # Becomes real in M7 when apps/web exists (Playwright against
        # `next build && next start`). Kept as an explicit no-op stage, not
        # omitted, so the pipeline shape is stable from the first commit.
        run: echo "e2e:smoke lands in M7 (apps/web). Stage intentionally green."
      - name: eval
        # golden 24/24 (zero tolerance) + 200-seed fuzz + an in-process
        # re-run of the chaos suite diffed against the committed
        # chaos/results/latest.json (SPEC §8).
        run: pnpm test -- --project eval
      - name: chaos-drift
        # The committed README chaos block and chaos/RESULTS.md must render
        # byte-for-byte from the committed latest.json (SPEC §7: the README
        # cannot drift from the numbers).
        run: node scripts/chaos-report.mjs --check

      # Publish-shape guards (SPEC §8): dist compiles, tarball resolves to dist/.
      - name: build
        run: pnpm build
      - name: pack-check
        run: pnpm ci:pack-check
