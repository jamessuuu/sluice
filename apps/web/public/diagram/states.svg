<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 424" role="img" aria-labelledby="sluice-diagram-title sluice-diagram-desc">
<title id="sluice-diagram-title">sluice's exactly-once state machine: in_flight to succeeded, failed, or indeterminate</title>
<desc id="sluice-diagram-desc">A directed diagram. One box, in_flight, has three outgoing arrows, drawn as a single stem that forks into three branches. The first branch leads to succeeded: the effect ran and its result was durably recorded, so every future caller replays that result instead of running the effect again. The second branch leads to failed: the effect provably did not happen, so it is safe to know the outcome and act on it. The third branch, drawn in amber because it is the only one that matters for this argument, leads to indeterminate: sluice could not determine whether the effect happened, for example a timeout after the call was sent, or a crash after the effect ran but before its result was persisted. Unlike the other two branches, indeterminate has no automatic path back to in_flight. By default sluice fails closed: the effect is parked as indeterminate and never silently retried. Leaving that state requires an explicit reclaim call, where the caller has declared the downstream operation safe to repeat, or a human decision recorded through an approval gate. Retries happen inside in_flight, under a single lease, before any terminal state is reached — they never turn a failed or indeterminate outcome into a fresh attempt.</desc>
